version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_prosperity_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./urban_prosperity.db
      - CSV_DATA_PATH=data/cities.csv
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urban_prosperity_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
